url: https://dataniel.github.io/lustrum

template:
  bootstrap: 5

navbar:
  structure:
    left: [intro, reference]
    right: [github]
  components:
    github:
      icon: fab fa-github
      href: https://github.com/dataniel/lustrum

home:
  strip_header: true

reference:
  - title: Describe
    desc: >
      Look at the structure before choosing a rule. Each returns a summary
      that prints, and judges nothing.
    contents:
      - describe_key
      - describe_panel
      - describe_spells
      - describe_varying

  - title: Checkpoints
    desc: >
      Each checkpoint states one rule about the structure of the data,
      warns or aborts with the offending rows, and returns its input, so it
      can sit in a pipeline.
    contents:
      - ensure_unique
      - ensure_balanced
      - ensure_no_overlap
      - ensure_constant
      - checkpoints

  - title: Spells and panels
    desc: >
      Merge spells recorded as several, convert spell data to a period
      panel, or add the status from spells to a panel you already have.
    contents:
      - merge_spells
      - spells_to_panel
      - add_spell_status

  - title: Package
    contents:
      - lustrum-package
